version: 2

models: 
  - name: dim_listings_cleansed
    description: This table contains cleansed listing data for Airbnb listings.
    columns: 
      - name: listing_id
        description: The primary key for the listing. 
        data_tests: 
          - not_null
          - unique

      - name: host_id
        description: The hosts's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
               values: ['Entire home/apt',
                      'Private room',
                      'Shared room',
                      'Hotel room']
 