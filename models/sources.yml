version: 2

sources:
  - name: airbnb
    schema: raw
    tables:
      - name: raw_listings
        identifier: raw_listings

      - name: raw_hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews
        config: 
          loaded_at_field: date
          freshness:
            warn_after: {count: 12, period: hour}
            # error_after: {count: 24, period: hour}